name: Keep Render Alive

on:
  schedule:
    # Пинг каждые 10 минут с 7:00 до 22:00 МСК (4:00-19:00 UTC)
    - cron: '*/10 4-19 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping fot-pwa
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://fot-pwa.onrender.com/)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Service is alive"
          else
            echo "⚠️ Service returned $STATUS"
          fi
